[project]
name = "telemetry"
version = "1.0.0"
description = "Lab 2: vehicle telemetry in MongoDB vs PostgreSQL, Redis basics"
requires-python = ">=3.14"
dependencies = [
    "psycopg[binary]>=3.2",
    "pymongo>=4.15",
    "redis>=6.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["telemetry*"]
